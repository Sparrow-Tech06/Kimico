<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Infinite Brain Challenge</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/global.css">
  
</head>
<body>

<header class="header d-flex justify-content-between align-items-center px-3 py-2">
  <button class="back-btn" onclick="history.back()">
         <i class="bi bi-arrow-left"></i>
     </button>
    <!-- Coins -->
    <a href="coins/wallet.html" class="coin-btn d-flex align-items-center">
      <i class="bi bi-coin"></i>
      <span id="coinDisplay">0</span>
    </a>
</header>

<div class="container py-4">

  <!-- Sticky Streak Bar -->
  <div class="streak-wrapper mb-3">

    <div class="streak-top">
      <div class="streak-left"> 🔥 <span id="streak">0</span>/ 5 </div>
      <div class="shield-box" id="shieldBox"> 🛡  </div>
    </div>

    <div class="progress custom-progress mt-2">
      <div class="progress-bar" id="streakBar" style="width:0%"></div>
    </div>

  </div>

  <!-- Question Card -->
  <div class="question-card">

    <div class="category-selector">
       <button class="category-btn" id="categoryBtn">
          <i class="bi bi-grid-fill"></i>
          <span id="category">All Categories</span>
      </button>
   </div>

    <div class="question-text" id="question">
      Loading...
    </div>

    <div class="options" id="options"></div>

    

  </div>

  <!-- Category Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title"> Select Category </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal">
        </button>
      </div>

      <div class="modal-body">

        <div class="d-grid gap-2">

          <button class="btn btn-outline-primary category-option" data-category="All"> All </button>
          <button class="btn btn-outline-primary category-option" data-category="Sequence"> Sequence </button>
          <button class="btn btn-outline-primary category-option" data-category="Addition"> Addition </button>
          <button class="btn btn-outline-primary category-option" data-category="Logic Math"> Logic Math </button>
          <button class="btn btn-outline-primary category-option" data-category="Percentage"> Percentage </button>
          <button class="btn btn-outline-primary category-option" data-category="Algebra"> Algebra </button>
          <button class="btn btn-outline-primary category-option" data-category="Odd/Even"> Odd/Even </button>
          <button class="btn btn-outline-primary category-option" data-category="Geometry"> Geometry </button>
          <button class="btn btn-outline-primary category-option" data-category="Squares"> Squares </button>
          <button class="btn btn-outline-primary category-option" data-category="Fractions"> Fractions </button>
          <button class="btn btn-outline-primary category-option" data-category="Decimals"> Decimals </button>
          <button class="btn btn-outline-primary category-option" data-category="Cubes"> Cubes </button>
          <button class="btn btn-outline-primary category-option" data-category="Trigonometry"> Trigonometry </button>
          <button class="btn btn-outline-primary category-option" data-category="Circle"> Circle </button>
          <button class="btn btn-outline-primary category-option" data-category="Triangle"> Triangle </button>
          <button class="btn btn-outline-primary category-option" data-category="GK"> GK </button>

        </div>

      </div>

    </div>
  </div>
</div>

</div>
  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
<script src="generators.js"></script>
<script src="app.js"></script>
<script src="../js/get-coin.js"></script>
<script src="../control_center/version-check.js"> </script>
<script src="js/vibrator.js"> </script>

<script>
    const coin = parseInt(localStorage.getItem("coins")) || 0;
    document.getElementById("coinDisplay").innerText = coin + " Coins";
</script>
  
</body>
</html>
