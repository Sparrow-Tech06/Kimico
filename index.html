<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathRush</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/flower.css">
    
</head>
<body>

   <header class="header d-flex justify-content-between align-items-center px-3 py-2">

  <!-- Brand -->
  <h1 class="brand m-0"> QMath </h1>

  <!-- Right Icons -->
  <nav class="d-flex align-items-center gap-2">

    <!-- Notifications -->
    <a href="notifications/notifications.html" class="icon-circle position-relative">
      <i class="bi bi-bell"></i>
    </a>

    <!-- Settings -->
    <a href="pages/settings.html" class="icon-circle">
      <i class="bi bi-gear"></i>
    </a>

  </nav>

</header>
    
    
    <main>
        
       <section class="xp-card">

         <div class="level-badge">
            <i class="bi bi-crown-fill"></i>
            <span id="levelNumber">1</span>
        </div>

         <div class="xp-content">
            <div class="xp-title">  TOTAL XP </div>
            <div class="xp-value" id="xpDisplay"> 0 XP </div>

            <div class="progress-container">
               <div class="progress-fill" id="xpBar"> </div>
           </div>

           <div class="progress-info">
              <span id="currentLevelText"> Level 1 </span>
              <span id="nextLevelText"> Loading... </span>
          </div>

    </div>

</section>
        

<section>

<h2 class="section-title">Explore</h2>

<div class="cards" id="cards"></div>

</section>

</main>

<script>

const sections = [
{
    title:'Quiz',
    subtitle:'Practice',
    icon:'bi-patch-question-fill',
    class:'quiz',
    link:'main_quiz/quiz.html'
},
{
    title:'AI Battle',
    subtitle:'Challenge',
    icon:'bi-robot',
    class:'battle',
    link:'activities/battle.html'
},
{
    title:'Formulas',
    subtitle:'Shortcuts',
    icon:'bi-grid-3x3-gap-fill',
    class:'formula',
    link:'#'
},
{
    title:'Daily Bonus',
    subtitle:'Rewards',
    icon:'bi-gift-fill',
    class:'bonus',
    link:'#'
}
];

const cards = document.getElementById('cards');

sections.forEach(item => {

cards.innerHTML += `
<a href="${item.link}" class="explore-card app-card">

<div class="card-icon ${item.class}">
<i class="bi ${item.icon}"></i>
</div>

<h3 class="card-title">${item.title}</h3>

<p class="card-subtitle">${item.subtitle}</p>

</a>
`;

});

document.querySelectorAll('.app-card, .back-btn').forEach(item => {

item.addEventListener('click', () => {
    navigator.vibrate?.(60);
});

});

</script>
    
<script>

async function loadLevelSystem() {

    const coins = parseInt(localStorage.getItem("coins")) || 0;

    document.getElementById("xpDisplay")
        .textContent = coins.toLocaleString() + " XP";

    try {

        const response = await fetch("data/levels.json");
        const data = await response.json();

        const levels = data.levels;

        let currentLevel = 1;
        let currentRequired = 0;
        let nextRequired = 50;

        for (let i = 0; i < levels.length; i++) {

            if (coins >= levels[i].required) {

                currentLevel = levels[i].level;
                currentRequired = levels[i].required;

                if (levels[i + 1]) {
                    nextRequired = levels[i + 1].required;
                } else {
                    nextRequired = currentRequired + 500;
                }
            }
        }

        const progress =
            ((coins - currentRequired) /
            (nextRequired - currentRequired)) * 100;

        document.getElementById("levelNumber")
            .textContent = currentLevel;

        document.getElementById("currentLevelText")
            .textContent = "Level " + currentLevel;

        document.getElementById("nextLevelText")
            .textContent =
            (nextRequired - coins) +
            " XP to Level " +
            (currentLevel + 1);

        document.getElementById("xpBar")
            .style.width =
            Math.max(0, Math.min(progress, 100)) + "%";

    } catch (error) {

        console.error("Level System Error:", error);

    }
}

loadLevelSystem();

</script>

</body>
</html>
