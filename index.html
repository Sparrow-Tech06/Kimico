<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathRush</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#fff;
    color:#1f1f1f;
}

main{
    max-width:430px;
    min-height:100vh;
    margin:auto;
    padding:18px;
}

header{
    display:grid;
    grid-template-columns:48px 1fr 48px;
    align-items:center;
    margin-bottom:22px;
}

.header-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:14px;
    background:#f6f1eb;
    color:#8b5e3c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.app-name{
    text-align:center;
    font-size:22px;
    font-weight:700;
    color:#6b4423;
    letter-spacing:0.4px;
}

.balance-card{
    background:linear-gradient(135deg,#8b5e3c,#b9855c);
    border-radius:28px;
    padding:22px;
    margin-bottom:24px;
}

.balance-top{
    font-size:12px;
    letter-spacing:0.6px;
    color:rgba(255,255,255,0.75);
    margin-bottom:14px;
}

.balance-content{
    display:flex;
    align-items:center;
    gap:16px;
}

.balance-icon{
    width:65px;
    height:65px;
    border-radius:20px;
    background:rgba(255,255,255,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:28px;
}

.balance-number{
    color:#fff;
    font-size:38px;
    font-weight:700;
    line-height:1;
}

.balance-text{
    margin-top:5px;
    color:rgba(255,255,255,0.82);
    font-size:13px;
}

.section-title{
    font-size:20px;
    font-weight:700;
    color:#2a2a2a;
    margin-bottom:18px;
}

.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.explore-card{
    text-decoration:none;
    background:#fff;
    border-radius:24px;
    padding:18px;
    border: 2px solid #f1ece7;
   /* box-shadow: 0px 4px 1px 0px #b9855c; */
    transition:0.2s;
 }

.explore-card:hover{
    transform:translateY(-3px);
}

.card-icon{
    width:58px;
    height:58px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    margin-bottom:16px;
}

.quiz{
    background:#f7efe7;
    color:#8b5e3c;
}

.battle{
    background:#f8ebe3;
    color:#a05a2c;
}

.formula{
    background:#f3ede7;
    color:#6d4c41;
}

.bonus{
    background:#fff4e8;
    color:#c27b35;
}

.card-title{
    font-size:17px;
    font-weight:600;
    color:#222;
}

.card-subtitle{
    margin-top:4px;
    color:#7a7a7a;
    font-size:12px;
}

</style>
</head>
<body>

<main>

<header>

<button class="header-btn" aria-label="Notifications">
<i class="bi bi-bell"></i>
</button>

<h1 class="app-name">MathRush</h1>

<button class="header-btn" aria-label="Settings">
<i class="bi bi-gear"></i>
</button>

</header>

<section class="balance-card">

<div class="balance-top">TOTAL XP</div>

<div class="balance-content">

<div class="balance-icon">
<i class="bi bi-lightning-charge-fill"></i>
</div>

<div>
<h2 class="balance-number">1,250</h2>
<p class="balance-text">Level Progress</p>
</div>

</div>

</section>

<section>

<h2 class="section-title">Explore</h2>

<div class="cards" id="cards"></div>

</section>

</main>

<script>

const sections = [
{
    title:'Quiz',
    subtitle:'Practice',
    icon:'bi-patch-question-fill',
    class:'quiz',
    link:'#'
},
{
    title:'AI Battle',
    subtitle:'Challenge',
    icon:'bi-robot',
    class:'battle',
    link:'#'
},
{
    title:'Formulas',
    subtitle:'Shortcuts',
    icon:'bi-grid-3x3-gap-fill',
    class:'formula',
    link:'#'
},
{
    title:'Daily Bonus',
    subtitle:'Rewards',
    icon:'bi-gift-fill',
    class:'bonus',
    link:'#'
}
];

const cards = document.getElementById('cards');

sections.forEach(item => {

cards.innerHTML += `
<a href="${item.link}" class="explore-card">

<div class="card-icon ${item.class}">
<i class="bi ${item.icon}"></i>
</div>

<h3 class="card-title">${item.title}</h3>

<p class="card-subtitle">${item.subtitle}</p>

</a>
`;

});

</script>

</body>
</html>
