<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathRush</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#fff;
    color:#111;
}

.app{
    max-width:430px;
    margin:auto;
    min-height:100vh;
    padding:18px;
}

.header{
    display:grid;
    grid-template-columns:50px 1fr 50px;
    align-items:center;
    margin-bottom:22px;
}

.header-title{
    text-align:center;
    font-size:24px;
    font-weight:700;
    color:#5b3df5;
    letter-spacing:0.5px;
}

.header-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:14px;
    background:#f5f6ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    color:#5b3df5;
}

.balance-card{
    background:linear-gradient(135deg,#6d4cff,#8b5dff);
    border-radius:30px;
    padding:24px;
    margin-bottom:24px;
}

.balance-label{
    font-size:13px;
    color:rgba(255,255,255,0.8);
    margin-bottom:14px;
    letter-spacing:0.5px;
}

.balance-content{
    display:flex;
    align-items:center;
    gap:16px;
}

.balance-icon{
    width:68px;
    height:68px;
    border-radius:22px;
    background:#fff;
    color:#6d4cff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:700;
}

.balance-number{
    font-size:38px;
    line-height:1;
    font-weight:700;
    color:#fff;
}

.balance-text{
    margin-top:6px;
    color:rgba(255,255,255,0.85);
    font-size:14px;
}

.section-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:18px;
}

.card-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.explore-card{
    text-decoration:none;
    background:#fff;
    border-radius:26px;
    padding:20px 18px;
    box-shadow:0 8px 22px rgba(0,0,0,0.05);
    transition:0.25s;
    border:1px solid #f2f2f2;
}

.explore-card:hover{
    transform:translateY(-3px);
}

.card-icon{
    width:62px;
    height:62px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-bottom:16px;
}

.quiz{
    background:#efe9ff;
    color:#7a4dff;
}

.battle{
    background:#ffeaf1;
    color:#ff4b7d;
}

.formula{
    background:#e8fff5;
    color:#00b96b;
}

.bonus{
    background:#fff4df;
    color:#ff9800;
}

.card-title{
    font-size:18px;
    font-weight:600;
    color:#111;
}

.card-subtitle{
    margin-top:5px;
    color:#777;
    font-size:13px;
    line-height:1.5;
}

</style>
</head>
<body>

<main class="app">

    <header class="header">

        <button class="header-btn">
            <i class="bi bi-bell"></i>
        </button>

        <h1 class="header-title">MathRush</h1>

        <button class="header-btn">
            <i class="bi bi-gear"></i>
        </button>

    </header>

    <section class="balance-card">

        <p class="balance-label">TOTAL MATH XP</p>

        <div class="balance-content">

            <div class="balance-icon">
                <i class="bi bi-lightning-charge-fill"></i>
            </div>

            <div>
                <h2 class="balance-number">1,250</h2>
                <p class="balance-text">Level Progress</p>
            </div>

        </div>

    </section>

    <section>

        <h2 class="section-title">Explore</h2>

        <div class="card-grid" id="exploreCards"></div>

    </section>

</main>

<script>

const sections = [
    {
        title:'Quiz',
        subtitle:'Practice questions',
        icon:'bi-patch-question-fill',
        class:'quiz',
        link:'#'
    },
    {
        title:'AI Battle',
        subtitle:'Challenge AI',
        icon:'bi-robot',
        class:'battle',
        link:'#'
    },
    {
        title:'Formulas',
        subtitle:'Math shortcuts',
        icon:'bi-grid-3x3-gap-fill',
        class:'formula',
        link:'#'
    },
    {
        title:'Daily Bonus',
        subtitle:'Claim rewards',
        icon:'bi-gift-fill',
        class:'bonus',
        link:'#'
    }
];

const container = document.getElementById('exploreCards');

sections.forEach(item => {

    container.innerHTML += `
    <a href="${item.link}" class="explore-card">

        <div class="card-icon ${item.class}">
            <i class="bi ${item.icon}"></i>
        </div>

        <h3 class="card-title">${item.title}</h3>

        <p class="card-subtitle">${item.subtitle}</p>

    </a>
    `;

});

</script>

</body>
</html>
