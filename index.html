<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathRush</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/flower.css">
    
</head>
<body>

   <header>

      <a href="notifications/notifications.html" class="back-btn" aria-label="Notifications">  <i class="bi bi-bell"></i> </a>            
       <h1 class="app-name">MathRush</h1>
      <a href="pages/settings.html" class="back-btn" aria-label="Settings"> <i class="bi bi-gear"></i> </a>

 </header>

    <main>
       <section class="xp-card">

    <div class="level-box">

        <div class="level-badge">
            <i class="bi bi-crown-fill"></i>
            <span id="levelNumber">1</span>
        </div>

    </div>

    <div class="xp-content">

        <div class="xp-title">TOTAL XP</div>

        <div class="xp-value" id="xpDisplay">0 XP</div>

        <div class="progress">
            <div class="progress-bar" id="xpBar"></div>
        </div>

        <div class="progress-info">
            <span id="currentLevelText">Level 1</span>
            <span id="nextLevelText">0 XP to Level 2</span>
        </div>

    </div>

    <div class="coin-section">

        <i class="bi bi-coin coin-icon"></i>

        <div class="coin-value" id="coinDisplay">
            0
        </div>

        <div class="coin-label">
            Coins
        </div>

        <button class="coin-btn">
            <i class="bi bi-plus-lg"></i>
        </button>

    </div>

</section>
        

<section>

<h2 class="section-title">Explore</h2>

<div class="cards" id="cards"></div>

</section>

</main>

<script>

const sections = [
{
    title:'Quiz',
    subtitle:'Practice',
    icon:'bi-patch-question-fill',
    class:'quiz',
    link:'main_quiz/quiz.html'
},
{
    title:'AI Battle',
    subtitle:'Challenge',
    icon:'bi-robot',
    class:'battle',
    link:'activities/battle.html'
},
{
    title:'Formulas',
    subtitle:'Shortcuts',
    icon:'bi-grid-3x3-gap-fill',
    class:'formula',
    link:'#'
},
{
    title:'Daily Bonus',
    subtitle:'Rewards',
    icon:'bi-gift-fill',
    class:'bonus',
    link:'#'
}
];

const cards = document.getElementById('cards');

sections.forEach(item => {

cards.innerHTML += `
<a href="${item.link}" class="explore-card app-card">

<div class="card-icon ${item.class}">
<i class="bi ${item.icon}"></i>
</div>

<h3 class="card-title">${item.title}</h3>

<p class="card-subtitle">${item.subtitle}</p>

</a>
`;

});

document.querySelectorAll('.app-card, .back-btn').forEach(item => {

item.addEventListener('click', () => {
    navigator.vibrate?.(60);
});

});

</script>
    
<script>

async function loadLevelSystem(){

    const coin =
        parseInt(localStorage.getItem("coins")) || 0;

    const xp =
        parseInt(localStorage.getItem("xp")) || 0;

    document.getElementById("coinDisplay")
        .innerText = coin;

    document.getElementById("xpDisplay")
        .innerText = xp.toLocaleString() + " XP";

    const res =
        await fetch("data/levels.json");

    const data =
        await res.json();

    const levels = data.levels;

    let currentLevel = 1;
    let currentRequired = 0;
    let nextRequired = 0;

    for(let i=0;i<levels.length;i++){

        if(xp >= levels[i].required){

            currentLevel = levels[i].level;
            currentRequired = levels[i].required;

            nextRequired =
                levels[i+1]
                ? levels[i+1].required
                : currentRequired + 500;
        }
    }

    const progress =
        ((xp-currentRequired) /
        (nextRequired-currentRequired))*100;

    document.getElementById("levelNumber")
        .innerText = currentLevel;

    document.getElementById("currentLevelText")
        .innerText = "Level " + currentLevel;

    document.getElementById("nextLevelText")
        .innerText =
        (nextRequired - xp) +
        " XP to Level " +
        (currentLevel+1);

    document.getElementById("xpBar")
        .style.width =
        Math.min(progress,100) + "%";
}

loadLevelSystem();

</script>

</body>
</html>
