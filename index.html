<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathRush</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/flower.css">
    
</head>
<body>

   <header>

      <a href="notifications/notifications.html" class="header-btn" aria-label="Notifications">  <i class="bi bi-bell"></i> </a>            
       <h1 class="app-name">MathRush</h1>
      <a href="pages/settings.html" class="header-btn" aria-label="Settings"> <i class="bi bi-gear"></i> </a>

 </header>

    <main>
       <section class="balance-card">

      <div class="balance-top">TOTAL XP</div>

      <div class="balance-content">

      <div class="balance-icon">
         <i class="bi bi-lightning-charge-fill"></i>
     </div>

<div>
<h2 class="balance-number">1,250</h2>
<p class="balance-text">Level Progress</p>
</div>

</div>

</section>

<section>

<h2 class="section-title">Explore</h2>

<div class="cards" id="cards"></div>

</section>

</main>

<script>

const sections = [
{
    title:'Quiz',
    subtitle:'Practice',
    icon:'bi-patch-question-fill',
    class:'quiz',
    link:'main_quiz/quiz.html'
},
{
    title:'AI Battle',
    subtitle:'Challenge',
    icon:'bi-robot',
    class:'battle',
    link:'activities/battle.html'
},
{
    title:'Formulas',
    subtitle:'Shortcuts',
    icon:'bi-grid-3x3-gap-fill',
    class:'formula',
    link:'#'
},
{
    title:'Daily Bonus',
    subtitle:'Rewards',
    icon:'bi-gift-fill',
    class:'bonus',
    link:'#'
}
];

const cards = document.getElementById('cards');

sections.forEach(item => {

cards.innerHTML += `
<a href="${item.link}" class="explore-card">

<div class="card-icon ${item.class}">
<i class="bi ${item.icon}"></i>
</div>

<h3 class="card-title">${item.title}</h3>

<p class="card-subtitle">${item.subtitle}</p>

</a>
`;

});

</script>

</body>
</html>
