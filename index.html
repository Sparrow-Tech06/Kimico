<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Brain Challenge</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container py-4">

  <!-- Top Bar -->
  <div class="topbar mb-4">

    <div>
      <h2 class="title">🧠 Brain Challenge</h2>
      <p class="subtitle">Unlimited Auto Questions</p>
    </div>
     <!-- Coins -->
    <a href="js/wallet.html" class="coin-btn d-flex align-items-center">
      <i class="bi bi-coin"></i>
      <span id="coinDisplay"></span>
    </a>
  </div>

  <!-- Sticky Streak Bar -->
  <div class="streak-wrapper mb-4">

    <div class="streak-top">

      <div class="streak-left">
        🔥 <span id="streak">0</span>/5
      </div>

      <div class="shield-box" id="shieldBox">
        🛡 Shield
      </div>

    </div>

    <div class="progress custom-progress mt-3">
      <div class="progress-bar" id="streakBar" style="width:0%"></div>
    </div>

  </div>

  <!-- Question Card -->
  <div class="question-card">

    <div class="category" id="category">
      Math
    </div>

    <div class="question-text" id="question">
      Loading...
    </div>

    <div class="options" id="options"></div>

    

  </div>

</div>

<script src="generators.js"></script>
<script src="app.js"></script>
<script src="js/get-coin.js"></script>

<script>
    const coin = parseInt(localStorage.getItem("coins")) || 0;
    document.getElementById("coinDisplay").innerText = coin + " Coins";
</script>
  
</body>
</html>
