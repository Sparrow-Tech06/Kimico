<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Formula Explorer</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/home-formula.css">
</head>
<body>

<div class="container py-4">

  <div class="text-center mb-5">
    <h1 class="main-title">⚡ Formula Explorer</h1>
    <p class="sub-title">Explore all math formulas visually</p>
  </div>

  <div class="row g-4">

    <div class="col-md-4">
      <div class="formula-card" onclick="openTopic('triangle')">
        <img src="assets/images/triangle.png" class="topic-image">
        <h3>Triangle</h3>
        <p>Area, Perimeter, Pythagoras</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="formula-card" onclick="openTopic('circle')">
        <img src="assets/images/circle.png" class="topic-image">
        <h3>Circle</h3>
        <p>Area, Radius, Circumference</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="formula-card" onclick="openTopic('square')">
        <img src="assets/images/square.png" class="topic-image">
        <h3>Square</h3>
        <p>Area & Perimeter</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="formula-card" onclick="openTopic('algebra')">
        <img src="assets/images/algebra.png" class="topic-image">
        <h3>Algebra</h3>
        <p>Identities & Equations</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="formula-card" onclick="openTopic('trigonometry')">
        <img src="assets/images/trigonometry.png" class="topic-image">
        <h3>Trigonometry</h3>
        <p>Sin, Cos, Tan</p>
      </div>
    </div>

  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
