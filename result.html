<!DOCTYPE html>
<html>
<head>
  <title>Result</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-dark text-white text-center">

<div class="container py-5">

  <h2 id="resultText"></h2>

  <a href="quiz.html" class="btn btn-warning mt-3">Next</a>

</div>

<script>
let res = localStorage.getItem("result");

if(res === "correct"){
  document.getElementById("resultText").innerText = "🔥 PERFECT!";
}else{
  document.getElementById("resultText").innerText = "❌ WRONG!";
}
</script>

</body>
</html>
